# Read by lib-installer. See https://github.com/nimaltd/lib-installer
#
# A library made to try the installer on, and a starting point for your own:
# copy this file to the root of your library's repository, and change what is
# yours. Only name and its headers or sources are required. The keys this
# library has no use for are here too, commented out, so every one is in one
# place.
#
# There is no version here. The installer reads it from the @version tag in
# the first header listed, so the source files are the only place it is written.
#
# Written for 4.0.0: every file keeps the path it has here, src/example.h
# lands at lib/example/src/example.h, and every path naming a place in the
# project starts at the project's folder. What the library writes sits under
# where it goes, pio.project for the project's platformio.ini and pio.library
# for its own library.json, and a list of flags can be given in groups under
# their titles, a flag with a note.

name: example                      # the library's name, and its folder in lib/
description: A period that never blocks, made to try lib-installer on
repository: https://github.com/nimaltd/lib-installer-example-pio
license: Apache-2.0                # the licence's SPDX name
platform: pio                      # the projects it is for: stm32, zephyr, esp32,
                                   # arduino and pio, one or a list of them

kind: utility                      # driver, middleware, rtos, protocol, filesystem,
                                   # utility or bsp
category: timing                   # sensor, storage, display, communication, wireless,
                                   # rtos, timing, power, input, math or system
provides: []                       # what it gives other libraries: [rtos] for an RTOS

requires:
  lib_installer: 4.0.0             # the oldest lib-installer that reads this file
  libraries: []                    # other libraries, installed first when missing,
                                   # into lib/ beside it:
                                   #   - osal >= 1.0.0       no owner means nimaltd
                                   #   - owner/lib           anyone else's
                                   #   - owner/lib@v1.2.0    a tag, branch or commit
                                   #   - source: owner/other@v2.0.0
                                   #     manifest: manifests/other.yml
                                   #                         for a repository with no
                                   #                         installer.yml of its own
  peripherals: []                  # hardware it uses, named to the user, such as:
                                   #   - type: i2c
                                   #     note: 400 kHz

# install:
#   include_dirs: [src]            # include folders, only when the guess is wrong:
#                                  # the first is library.json's includeDir
#   defines:                       # build_flags in platformio.ini, for the whole project
#     - EXAMPLE_FAST               # NAME, or NAME=value

headers:                           # .h files; the first is the one to #include
  - src/example.h                  # every file keeps its path: lib/example/src/example.h
  - src/example_config.h           # your settings, in USER CODE lines kept on update
sources:                           # .c and .cpp files, the only ones PlatformIO builds
  - src/example.c
                                   # a wildcard works too: src/*.c in one folder,
                                   # src/**/*.c in every folder below src

options:                           # parts the user chooses at install
  uptime:                          # the name typed after --with and --without
    description: Uptime in hours, minutes and seconds   # the question asked
    libraries: []                  # libraries this part needs, installed first
    headers:                       # its files, written like headers and sources above
      - src/example_uptime.h
    sources:
      - src/example_uptime.c

extras:                            # copied as they are, never compiled
  - LICENSE.md                     # in the library's folder: lib/example/LICENSE.md
  - NOTICE
  - README.md
  - root: tools                    # tools/ into the project's folder instead, as the
                                   # library's own: written again on every install,
                                   # removed by an uninstall

# once:                            # the project's own files, made when missing and the
#   - partitions.csv               # user's from then on: never replaced or removed. A
#   - from: config/secrets.h       # path alone lands at that path in the project, a to
#     to: include/secrets.h        # at another place

run:                               # steps run once the files are in, each asked first
  - label: make-id                 # the name typed after --run and --no-run
    description: Make this board's own ID, include/example_id.h   # shown with the question
    script: tools/make_id.py       # Python, run with the installer's own Python: the
                                   # project's tools/make_id.py, which the extra above
                                   # puts there. {library}/... is one in the library
    args: [include/example_id.h]   # given to the script, in the project's folder;
                                   # include/ is on the include path of src/
    unless: include/example_id.h   # skipped when this file is there already

pio:                               # read by lib-installer only
  project:                         # written into the project's platformio.ini
    build_flags:                   # flags for every file of the build, in the library's
                                   # block of build_flags, after its defines
      Sections the linker can drop when nothing uses them:
        - -ffunction-sections: a section for each function
        - -fdata-sections: and one for each variable
                                   # a title, between two lines of stars, and a note,
                                   # written as ; comments above their lines
  library:                         # written into its own library.json
    frameworks: ["*"]              # the frameworks it builds with, such as
                                   # [arduino, espidf]; * for any
    platforms: ["*"]               # the platforms it builds for, such as
                                   # [espressif32, ststm32]; * for any
    # dependencies:                # PlatformIO Registry libraries it needs, as owner/name,
    #   - bblanchon/ArduinoJson@^7 # with @version when one is needed. PlatformIO
                                   # installs them by itself at the next build
